PACKAGE_NAME="r9700_tune_v2"
PACKAGE_VERSION="1.1"

# The module takes every struct offset as a module parameter, so the source does
# not need to change when the kernel changes. DKMS's default make invocation
# (make -C <kernel build dir> M=<dkms build dir>) is used.

BUILT_MODULE_NAME[0]="r9700_tune_v2"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates"

# Rebuild for every new kernel (plan §7.5). This only builds and installs the
# .ko; nothing loads it automatically - apply-debian.sh loads it with the
# offsets produced by gen-offsets.sh.
AUTO_INSTALL="yes"
